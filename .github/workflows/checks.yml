name: Проверки скрипта

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Luau + тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Компилятор Luau (тот же, что в Roblox)
        run: npm install luau-web --prefix /tmp/lw

      - name: Проверки
        run: bash tools/check_all.sh
