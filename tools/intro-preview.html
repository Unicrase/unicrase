<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enkaisy — заставка после ключа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
  :root{--acc:#5b8cff;--w:#fff;--mut:#8b929d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070708;overflow:hidden;color:#dfe4ec;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{position:fixed;inset:0;background:#0b0b0d;overflow:hidden;cursor:default}
  .vig{position:absolute;left:0;right:0;height:34%;pointer-events:none}
  .vig.top{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0))}
  .vig.bot{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0))}
  #halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(91,140,255,.55) 0%, rgba(91,140,255,.18) 42%, rgba(91,140,255,0) 68%);
    opacity:0;pointer-events:none}
  .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
    border:2px solid rgba(255,255,255,.85);opacity:0;pointer-events:none}
  .ring.acc{border-color:rgba(91,140,255,.9);border-width:2px}
  .shard{position:absolute;left:50%;top:50%;border-radius:3px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(91,140,255,.55));
    box-shadow:0 0 8px rgba(160,190,255,.45)}
  #word{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;align-items:center;
    justify-content:center;font-family:'Michroma',Roboto,sans-serif;font-weight:400;
    color:#fff;letter-spacing:0;white-space:nowrap;pointer-events:none}
  #word span{display:inline-block;opacity:0;transform:scale(.7) rotate(-6deg);
    text-shadow:0 3px 0 #000, 0 0 22px rgba(91,140,255,.55)}
  #shineClip{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);overflow:hidden;pointer-events:none}
  #shine{position:absolute;top:50%;left:-30%;transform:translate(-50%,-50%) rotate(18deg);
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));opacity:0}
  #sub{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:12px;letter-spacing:.34em;
    color:#8b929d;opacity:0;text-transform:uppercase;pointer-events:none}
  #rule{position:absolute;left:50%;top:67.5%;transform:translate(-50%,-50%);height:2px;width:0;
    background:#5b8cff;border-radius:1px;opacity:0;pointer-events:none}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;
    padding:10px;font-size:12px;color:#8b929d;background:rgba(8,8,10,.92);border-top:1px solid #1d1f25;z-index:99}
  .pill{border:1px solid #2a2c33;background:#15161b;color:#e2e6ee;padding:6px 12px;border-radius:8px;cursor:pointer}
  .pill:hover{background:#1d1f26}
  .note{position:fixed;left:12px;top:12px;font-size:11px;color:#5d646f;line-height:1.5;max-width:260px;z-index:99}
</style>
</head>
<body>
<div id="stage">
  <div class="vig top"></div><div class="vig bot"></div>
  <div id="halo"></div>
  <div class="ring" id="r1"></div><div class="ring acc" id="r2"></div>
  <div id="word"></div>
  <div id="shineClip"><div id="shine"></div></div>
  <div id="sub">MOBILE AIM ASSIST</div>
  <div id="rule"></div>
</div>

<div class="note">
  Превью заставки после ключа.<br>
  Шрифт — Michroma (в скрипте он же, фолбэк Gotham Black).<br>
  Длительность 3.1 с, пропустить нельзя.
</div>

<div class="bar">
  <span id="clock">0.00 с</span>
  <span class="pill" id="replay">повторить</span>
  <span class="pill" id="slow">скорость 1×</span>
</div>

<script>
const WORD = "UNICRASE";
const LEN = 3.1;
const stage = document.getElementById('stage');
const halo = document.getElementById('halo');
const wordEl = document.getElementById('word');
const shineEl = document.getElementById('shine');
const shineClip = document.getElementById('shineClip');
const subEl = document.getElementById('sub');
const ruleEl = document.getElementById('rule');
const r1 = document.getElementById('r1'), r2 = document.getElementById('r2');
const SPEEDS = [1, 0.5, 0.25, 0.1];
let speedIdx = 0, speed = 1;

/* геометрия: как в скрипте — от ширины экрана, трекинг по высоте букв */
let letters = [];
function build(){
  wordEl.innerHTML = '';
  letters = [];
  const w = Math.min(window.innerWidth, 900);
  const target = Math.max(170, Math.min(780, w * 0.84));
  // Michroma широкая: ~0.78em на заглавную букву
  const h = Math.max(18, Math.min(190, Math.floor(target / (WORD.length * 0.78) * 1.05)));
  wordEl.style.fontSize = h + 'px';
  const pad = Math.max(1, Math.floor(h * 0.03));
  for (const ch of WORD){
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.marginRight = pad + 'px';
    wordEl.appendChild(s);
    letters.push(s);
  }
  const box = wordEl.getBoundingClientRect();
  shineClip.style.width = (box.width + 40) + 'px';
  shineClip.style.height = (box.height * 1.6) + 'px';
  shineEl.style.width = (box.width * 0.18) + 'px';
  shineEl.style.height = (box.height * 1.6) + 'px';
  subEl.style.fontSize = Math.max(9, Math.min(20, Math.round(h * 0.2))) + 'px';
  halo.style.width = halo.style.height = (box.width * 1.5) + 'px';
  return box.width * 0.5;
}

/* осколки: 30 штук по кругу, вытянутые «стёкла» с градиентом */
let shards = [];
function buildShards(){
  shards.forEach(s => s.el.remove());
  shards = [];
  for (let i = 0; i < 30; i++){
    const a = (i / 30) * Math.PI * 2 + (Math.random() - 0.5) * 0.22;
    const tall = i % 3 !== 0;
    const w = tall ? 2 + Math.random() * 2 : 5 + Math.random() * 3;
    const h = tall ? 16 + Math.random() * 26 : 6 + Math.random() * 4;
    const el = document.createElement('div');
    el.className = 'shard';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.opacity = '0';
    stage.appendChild(el);
    shards.push({el, a, w, h, spin: (Math.random() - 0.5) * 180,
                 delay: Math.random() * 0.3, dur: 0.55 + Math.random() * 0.3});
  }
}

let raf = null, t0 = 0, done = false, ruleW = 0;

function reset(){
  cancelAnimationFrame(raf);
  done = false;
  letters.forEach(s => { s.style.opacity = '0'; s.style.transform = 'scale(.7) rotate(-6deg)';
                         s.style.transition = 'none'; s.style.textShadow = '0 3px 0 #000, 0 0 0 rgba(0,0,0,0)'; });
  halo.style.opacity = '0'; halo.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  [r1, r2].forEach(r => { r.style.opacity = '0'; r.style.width = r.style.height = '10px'; });
  shineEl.style.opacity = '0'; shineEl.style.left = '-30%';
  subEl.style.opacity = '0'; ruleEl.style.opacity = '0'; ruleEl.style.width = '0px';
  stage.style.background = '#0b0b0d';
  buildShards();
  ruleW = build();
  document.getElementById('clock').textContent = '0.00 с';
}

function play(){
  reset();
  t0 = performance.now();
  raf = requestAnimationFrame(frame);
}

function frame(now){
  const t = ((now - t0) / 1000) * speed;
  step(t);
  document.getElementById('clock').textContent = t.toFixed(2) + ' с';
  if (t < LEN) raf = requestAnimationFrame(frame);
  else finish();
}

function step(t){
  /* осколки: летят к центру с ускорением, вращаются, истончаются */
  for (const sh of shards){
    const k = Math.max(0, Math.min(1, (t - sh.delay) / sh.dur));
    const ease = k * k;
    const d = 0.62 * (1 - ease);
    const cx = 50 + Math.cos(sh.a) * d * 100;
    const cy = 50 + Math.sin(sh.a) * d * 0.94 * 100;
    sh.el.style.left = cx + '%';
    sh.el.style.top = cy + '%';
    sh.el.style.transform = `translate(-50%,-50%) rotate(${sh.a * 180 / Math.PI + sh.spin * ease}deg)`;
    const thin = 1 - ease * 0.85;
    sh.el.style.width = Math.max(1, sh.w * thin) + 'px';
    sh.el.style.height = Math.max(2, sh.h * (1 - ease * 0.5)) + 'px';
    const vis = Math.max(0, Math.min(1, k * 3));
    sh.el.style.opacity = Math.max(0, Math.min(1, vis * 0.95 - ease * 0.95));
  }
  /* свет: нарастает к сборке, потом мягко дышит */
  const pulse = Math.max(0, Math.min(1, (t - 0.55) / 0.6));
  const breathe = 1 + Math.sin((t - 1.1) * 3) * 0.02;
  halo.style.opacity = String(pulse * 0.9);
  halo.style.transform = `translate(-50%,-50%) rotate(${t * 22}deg) scale(${breathe})`;

  /* буквы: пружина с перелётом, слева направо */
  letters.forEach((s, i) => {
    const start = 1.02 + (i + 1) * 0.055;
    const p = (t - start) / 0.5;
    if (p <= 0) return;
    const q = Math.min(1, p);
    const ease = 1 - Math.pow(1 - q, 4);
    const over = 1 + Math.sin(Math.min(1, q) * Math.PI) * 0.12; // overshoot пружины
    s.style.opacity = String(Math.min(1, q * 1.6));
    s.style.transform = `scale(${(0.7 + 0.3 * ease) * over}) rotate(${-6 * (1 - ease)}deg)`;
    s.style.textShadow = `0 3px 0 #000, 0 0 ${Math.round(22 * ease)}px rgba(91,140,255,${(0.55 * ease).toFixed(2)})`;
  });

  /* кольца: расходятся от сборки */
  [[r1, 1.02], [r2, 1.11]].forEach(([r, start]) => {
    const k = Math.max(0, Math.min(1, (t - start) / 0.75));
    if (k <= 0) return;
    const size = 40 + k * 620;
    r.style.width = r.style.height = size + 'px';
    r.style.opacity = String(Math.max(0, 0.85 * (1 - k)));
  });

  /* подпись и линия */
  if (t > 2.02){
    const k = Math.min(1, (t - 2.02) / 0.4);
    subEl.style.opacity = String(k);
    ruleEl.style.opacity = String(k);
    ruleEl.style.width = (ruleW * 0.5 * k) + 'px';
  }
  /* блик */
  if (t > 2.25){
    const k = Math.min(1, (t - 2.25) / 0.55);
    shineEl.style.opacity = String(0.55 * Math.sin(k * Math.PI));
    shineEl.style.left = (-30 + k * 160) + '%';
  }
  /* уход: всё гаснет вместе с фоном */
  if (t > 2.62){
    const out = Math.min(1, (t - 2.62) / 0.45);
    letters.forEach(s => s.style.opacity = String(1 - out));
    subEl.style.opacity = String(1 - out);
    ruleEl.style.opacity = String(1 - out);
    halo.style.opacity = String((1 - out) * 0.9);
    stage.style.background = `rgba(7,7,8,${(1 - out * 0.95).toFixed(3)})`;
  }
}

function finish(){
  cancelAnimationFrame(raf);
  if (done) return;
  done = true;
  stage.style.background = '#070708';
}

document.getElementById('replay').onclick = play;
document.getElementById('slow').onclick = e => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  speed = SPEEDS[speedIdx];
  e.currentTarget.textContent = 'скорость ' + (speed === 1 ? '1×' : speed + '×');
  play();
};
window.addEventListener('resize', () => { reset(); play(); });
play();
</script>
</body>
</html>
